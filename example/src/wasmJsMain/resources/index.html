<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spock Engine</title>
    <!--suppress HtmlUnknownTarget -->
    <script type="application/javascript" src="spock.js"></script>
    <style>
        html:has(body:has(canvas)), body:has(canvas) {
            margin: 0
        }

        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
        }

        body > header,
        body > header > h1 {
            margin-top: 0;
        }

        body > header > h1 {
            padding-top: .67em;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        footer {
            position: sticky;
            top: 100vh;
        }
    </style>
</head>
<body>

<canvas id="SpockTarget"></canvas>

</body>
</html>
